<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiosko ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9ecb,#ffd6e8);
    overflow:hidden;
    height:100vh;
}

.slide{
    position:absolute;
    width:100%;
    height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    animation:fade 0.6s ease;
}

.active{
    display:flex;
}

h1{
    color:white;
    font-size:32px;
    margin-bottom:25px;
    text-shadow:0 3px 10px rgba(0,0,0,0.25);
}

img{
    width:260px;
    max-width:85%;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 0 20px rgba(0,0,0,0.25);
}

.next{
    border:none;
    background:white;
    color:#ff4d88;
    padding:15px 28px;
    border-radius:20px;
    font-size:20px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.choice{
    border:none;
    padding:15px 28px;
    border-radius:20px;
    font-size:20px;
}

#si{
    background:#ff4d88;
    color:white;
}

#no{
    background:white;
    color:#ff4d88;
}

.finalText{
    font-size:38px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hearts{
    position:absolute;
    font-size:25px;
    animation:float 4s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }

    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

</style>
</head>

<audio id="musicNo" src="no.mp3"></audio>
