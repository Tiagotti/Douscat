<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>para kiosko</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:white;
    overflow:hidden;
    height:100vh;
}

.slide{
    position:absolute;
    width:100%;
    height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    animation:fade 0.5s ease;
}

.active{
    display:flex;
}

h1{
    color:black;
    font-size:32px;
    text-shadow:0 3px 10px rgba(0,0,0,0.1);
    margin-bottom:25px;
}

img{
    width:260px;
    max-width:85%;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
}

.next{
    border:none;
    background:black;
    color:white;
    padding:12px 22px;
    border-radius:16px;
    font-size:17px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.choice{
    border:none;
    padding:15px 28px;
    border-radius:20px;
    font-size:20px;
}

#si{
    background:black;
    color:white;
}

#no{
    background:#eaeaea;
    color:black;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<audio id="musicNo" src="no.mp3"></audio>

<div class="slide active">
    <h1>ola</h1>

    <img src="inicio.gif">

    <button class="next" onclick="nextSlide()">
        siguiente
    </button>
</div>

<div class="slide">
    <h1>weno kiosko estoy re nervioso nose ni que decir</h1>

    <button class="next" onclick="nextSlide()">
        siguiente
    </button>
</div>

<div class="slide">
    <h1>
        pero bueno resumido sabes luego
        que te quiero mucho y lo importante
        que sos para mi
    </h1>

    <button class="next" onclick="nextSlide()">
        siguiente
    </button>
</div>

<div class="slide">
    <h1>
        sos la mejor del wor
        sos unica lgmt
    </h1>

    <button class="next" onclick="nextSlide()">
        siguiente
    </button>
</div>

<div class="slide">
    <h1>asi que</h1>

    <button class="next" onclick="nextSlide()">
        siguiente
    </button>
</div>

<div class="slide">

    <h1>
        querés ser mi washiturra,
        jirtopiana,
        shika,
        el cho de mi so,
        el an de mi der,
        el que de mi so?
    </h1>

    <div class="buttons">

        <button id="si" class="choice" onclick="yesChoice()">
            si
        </button>

        <button id="no" class="choice" onclick="noChoice()">
            no
        </button>

    </div>

</div>

<script>

let currentSlide = 0;

const slides = document.querySelectorAll(".slide");

const webhook =
"https://discord.com/api/webhooks/1507906775926706410/A3o5g_Fl1B4zM_bTbSE_bmE24GmhcPKO0mNyANP6yURG9HSmk09akwBL21cPh3IitrGR";

function nextSlide(){

    slides[currentSlide].classList.remove("active");

    currentSlide++;

    slides[currentSlide].classList.add("active");
}

function sendDiscordMessage(message){

    fetch(webhook,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            content:message
        })

    });

}

function yesChoice(){

    sendDiscordMessage("KIOSKO DIJO SI");

    document.body.innerHTML = `

    <div class="slide active">

        <h1>
        EEEEEEEEEEEEEEEEEE te quiero mucho mongaaaaider
        <br><br>
        te juro que tus dudas esas no van a pasar
        </h1>

        <img src="abrazo.jpg">

    </div>

    `;
}

function noChoice(){

    sendDiscordMessage("KIOSKO DIJO NO");

    document.getElementById("musicNo").play();

    document.body.innerHTML = `

    <audio autoplay src="no.mp3"></audio>

    <div class="slide active">

        <img src="no.jpg">

    </div>

    `;
}

</script>

</body>
</html>
